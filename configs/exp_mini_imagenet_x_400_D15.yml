# ==============================================================================
# CONFIGURATION REGNETX-400MF - TEST DEPTH 15 (Moins profond)
# ==============================================================================
DEVICE: "cuda"

MODEL:
  NAME: RegNetX-400MF_D15 
  
  # --- Paramètres RegNetX-400MF (de base) ---
  INITIAL_WIDTH: 24  
  SLOPE: 24.48       
  QUANTIZED_PARAM: 2.54 
  # ATTENTION : La formule du RegNet va recalculer les largeurs des stages 
  # avec cette nouvelle profondeur, même si la pente (SLOPE) reste la même.
  
  # --- Paramètres MODIFIÉS ---
  NETWORK_DEPTH: 15   # <--- MODIFIÉ : Réduction de la profondeur (D=22 -> D=15)
  
  BOTTLENECK_RATIO: 1
  GROUP_WIDTH: 16      

TRAIN:
  # --- Configuration stable (20 Époques) ---
  EPOCHS: 20             
  NUM_CLASSES: 100
  BATCH_SIZE: 64        
  LR: 0.05             
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005 
  NUM_WORKERS: 8      
  WARMUP_EPOCHS: 5    
  SAVE_MODEL: True       

PATHS:
  DATA_ROOT: 'data/mini_imagenet_structured'
  LOG_DIR: 'logs/mini_imagenet_x_400mf_d15'
  MODEL_SAVE_DIR: 'saved_models/'
  CHECKPOINT_NAME: 'regnetx_400_d15.pth.tar'