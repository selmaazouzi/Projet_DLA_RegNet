# ==============================================================================
# CONFIGURATION REGNETX-200MF (Régularisation Augmentée)
# ==============================================================================
DEVICE: "cuda"

MODEL:
  NAME: RegNetX-200MF 
  
  # --- Paramètres RegNetX-200MF ---
  INITIAL_WIDTH: 24  
  SLOPE: 36.44       
  QUANTIZED_PARAM: 2.49 # Valeur légèrement différente
  NETWORK_DEPTH: 13   
  
  # --- Paramètres du X-Block ---
  BOTTLENECK_RATIO: 1
  GROUP_WIDTH: 8      

TRAIN:
  # --- Configuration d'entraînement Régularisée (30 Époques) ---
  EPOCHS: 20             
  NUM_CLASSES: 100
  BATCH_SIZE: 64        
  LR: 0.05             
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005  # Régularisation L2 augmentée
  NUM_WORKERS: 8      
  WARMUP_EPOCHS: 5    
  SAVE_MODEL: True       

PATHS:
  DATA_ROOT: 'data/mini_imagenet_structured'
  LOG_DIR: 'logs/mini_imagenet_x_200mf'
  MODEL_SAVE_DIR: 'saved_models/'
  CHECKPOINT_NAME: 'regnetx_mini_200_final.pth.tar'